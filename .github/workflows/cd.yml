name: Cd-pipeline

on:
  push:
    branches:
      - advanced

jobs:
    docker-build-and-deploy:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v3

          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v2

          - name: Log in to DockerHub
            uses: docker/login-action@v2
            with:
              username: ${{ vars.DOCKER_USERNAME }}
              password: ${{ secrets.DOCKER_PASSWORD }}

          - name: Build and push frontend image
            run: |
              docker build -t shabibi22/devboard-frontend:latest ./frontend
              docker push shabibi22/devboard-frontend:latest
              

          - name: Build and push backend image
            run: |
              docker build -t shabibi22/devboard-backend:latest ./backend
              docker push shabibi22/devboard-backend:latest
          - name: Deploy to server
            uses: appleboy/ssh-action@v1.0.3
            with:
              host: ${{ secrets.SERVER_HOST }} 
              username: ${{ secrets.SERVER_USER }}   #azureuser
              key: ${{ secrets.SERVER_SSH_KEY }}
              script: |
                cd /home/ubuntu/devboard/advance-devboards
                docker compose pull
                docker compose up -d 



