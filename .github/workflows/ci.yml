name: Ci-pipeline
on:
  push:
    branches:
      - advanced
  pull_request:
    branches:
      - advanced
jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: run lint
        run: |
          cd frontend && npm install && npm run lint
          echo "Linting and build completed successfully."  
      - name: setup go
        uses: actions/setup-go@v5
        with: 
          go-version: '1.21'
      - name: linting backend test
        run: | 
          cd backend && go vet ./...
          echo "Go vet completed successfully."
  Test:
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - name: checkout code
        uses: actions/checkout@v3
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: run frontend test
        run: |
            cd frontend && npm install && npm test
            echo "Frontend tests completed successfully."
      - name: setup go 
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: run backend test
        run: |
            cd backend && go test ./...
            echo "Backend tests completed successfully."